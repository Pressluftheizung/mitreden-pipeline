# Fehlertest der Prüf-KI (tools/fehlertest.py): findet sie eingebaute Fehler? Ergebnis nur ins private Repo.
# Start: config/fehlertest.txt ändern und hochladen, oder von Hand.
name: fehlertest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config/fehlertest.txt]

permissions:
  contents: read

concurrency:
  group: rohdaten
  cancel-in-progress: false

jobs:
  fehlertest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rohdaten holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pressluftheizung/mitreden-app
          ref: rohdaten
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: daten
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-sammeln.txt
      - run: pip install -r requirements-sammeln.txt
      - name: Fehlertest
        env:
          PRUEFER_API_KEY: ${{ secrets.PRUEFER_API_KEY }}
        run: python tools/fehlertest.py --daten daten --karten 5
      - name: Ergebnis ins private Repo
        if: ${{ !cancelled() }}
        working-directory: daten
        run: |
          git config user.name "mitreden-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A metriken
          git diff --cached --quiet && exit 0
          git commit -q -m "Fehlertest $(date -u +%Y-%m-%dT%H:%MZ)"
          for versuch in 1 2 3; do git push -q origin HEAD:rohdaten && exit 0; git pull -q --rebase origin rohdaten; done
          exit 1
