# Prüft, ob die KI-Schlüssel funktionieren (nur Modellnamen und Statuscodes im Log, keine Schlüssel, keine Texte).
name: ki-check

on:
  push:
    branches: [main]
    paths: [tools/ki_check.py, .github/workflows/ki-check.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rohdaten
  cancel-in-progress: false

jobs:
  ki-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Privates Repo holen (für die Modellliste)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pressluftheizung/mitreden-app
          ref: rohdaten
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: daten
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Schlüssel prüfen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRUEFER_API_KEY: ${{ secrets.PRUEFER_API_KEY }}
        run: python tools/ki_check.py --ausgabe daten/metriken/ki-modelle.json
      - name: Modellliste ins private Repo
        working-directory: daten
        run: |
          git config user.name "mitreden-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metriken/ki-modelle.json
          git diff --cached --quiet && exit 0
          git commit -q -m "KI-Modellliste"
          for versuch in 1 2 3; do git push -q origin HEAD:rohdaten && exit 0; git pull -q --rebase origin rohdaten; done
          exit 1
