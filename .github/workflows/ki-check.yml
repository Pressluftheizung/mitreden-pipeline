# Prüft, ob die KI-Schlüssel funktionieren (nur Modellnamen und Statuscodes im Log, keine Schlüssel, keine Texte).
name: ki-check

on:
  push:
    branches: [main]
    paths: [tools/ki_check.py, .github/workflows/ki-check.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ki-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Schlüssel prüfen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRUEFER_API_KEY: ${{ secrets.PRUEFER_API_KEY }}
        run: python tools/ki_check.py
