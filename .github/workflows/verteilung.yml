# Rangliste ohne KI rechnen und die Übersicht aller Geschichten ins private Repo schreiben (für die Kalibrierung).
# Start: config/verteilung.txt ändern und hochladen, oder von Hand.
name: verteilung

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config/verteilung.txt]

permissions:
  contents: read

concurrency:
  group: rohdaten
  cancel-in-progress: false

jobs:
  verteilung:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rohdaten holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Pressluftheizung/mitreden-app
          ref: rohdaten
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: daten
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/verteilung.py --daten daten
      - name: Ins private Repo
        working-directory: daten
        run: |
          git config user.name "mitreden-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A metriken
          git diff --cached --quiet && exit 0
          git commit -q -m "Verteilung $(date -u +%Y-%m-%dT%H:%MZ)"
          for versuch in 1 2 3; do git push -q origin HEAD:rohdaten && exit 0; git pull -q --rebase origin rohdaten; done
          exit 1
