# Taktgeber: startet jede Stunde "sammeln" und dreimal täglich "kontrolle".
#
# Warum nicht einfach "schedule" in sammeln.yml? GitHub hat dort am 28.10.2026 in fünf Stunden keinen einzigen
# geplanten Lauf gestartet (bei neuen Konten und Repos kommt das vor). Dieser Ablauf startet sich deshalb am Ende
# selbst neu (workflow_dispatch mit dem eingebauten Token ist dafür ausdrücklich erlaubt). Der Zeitplan unten
# springt nur ein, falls die Kette einmal reißt und GitHubs Zeitplan inzwischen funktioniert.
# Einmal von Hand starten: Actions → takt → Run workflow.
name: takt

on:
  schedule:
    - cron: "41 */2 * * *" # Ersatz, falls die Kette reißt
  workflow_dispatch:

permissions:
  actions: write # nur zum Starten der Abläufe dieses Repos

concurrency:
  group: takt # höchstens ein laufender und ein wartender Takt, die Kette verdoppelt sich nie
  cancel-in-progress: false

jobs:
  takt:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Sammeln (und zu Kontrollzeiten Kontrolle) starten
        run: |
          gh workflow run sammeln.yml
          # 6, 13, 18 Uhr UTC = 7, 14, 19 Uhr deutscher Winterzeit, vor den Ausgaben um 8, 15 und 20 Uhr
          case "$(date -u +%H)" in
            06|13|18) gh workflow run kontrolle.yml ;; # wartet wegen "concurrency: rohdaten", bis Sammeln fertig ist
          esac

      - name: Bis zur nächsten Stunde warten (:20)
        run: |
          jetzt=$(date -u +%s)
          ziel=$(( (jetzt / 3600 + 1) * 3600 + 20 * 60 ))
          if [ $(( ziel - jetzt )) -gt 4200 ]; then ziel=$(( ziel - 3600 )); fi
          echo "Nächster Takt: $(date -u -d @$ziel +%H:%M) UTC"
          sleep $(( ziel - jetzt ))

      - name: Nächsten Takt starten
        if: ${{ !cancelled() }}
        run: gh workflow run takt.yml
