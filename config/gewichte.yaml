# Gewichte für Algorithmus B (Wichtigkeit, PLAN.md 6B). Startwerte, werden in der Werkbank eingestellt.
#
# Wichtigkeit = (breite·Quellenbreite + lager·Lagerbreite + tempo·Tempo
#                + aufmerksamkeit·Aufmerksamkeit + platzierung·Platzierung)
#               × Mitreden-Faktor × Frische

gewichte:
  breite: 1.0
  lager: 0.6
  tempo: 0.5
  aufmerksamkeit: 1.2
  platzierung: 0.6

# Live-Aufmerksamkeit (PLAN.md 4.2): wird zum Mitreden-Faktor addiert (Aufmerksamkeit × live_faktor, höchstens live_maximum).
live_faktor: 0.4
live_maximum: 1.0

# Frische: Halbwertszeit in Stunden seit der neuesten Meldung der Geschichte.
frische_halbwertszeit_h: 18
frische_minimum: 0.2

# Tempo: Meldungen in den letzten Stunden.
tempo_fenster_h: 6

# Platzierung: Steht die Geschichte bei diesen Medien oben im Feed?
# (ap kommt über eine Google-News-Suche, deren Reihenfolge keine Startseite ist, deshalb nicht dabei.)
leitmedien: [tagesschau, spiegel, zeit, faz, sz, welt, bild, bbc_world, guardian_world, npr]
platzierung_bis: 10

# Google News Top (pipeline/abgleich.py): Wann gehört ein Google-Eintrag zu einer unserer Geschichten?
# Wert = Ähnlichkeit (bester Wert über alle Schlagzeilen des Eintrags) + Bonus für seltene gemeinsame Wörter.
# Je Google-Eintrag zählt die Hauptschlagzeile allein oder mindestens zwei verwandte Schlagzeilen (siehe abgleich.py).
# Geeicht am 28.10.2026 an 144 von Hand bewerteten Einträgen (zwei Stände): 96 von 99 echten Treffern gefunden,
# 2 falsch zugeordnet.
google_news:
  treffer: 0.85              # Ähnlichkeit + Wortbonus ab hier: gehört sicher zur Geschichte
  unsicher: 0.70             # nur für die Messung: darüber "unsicher" statt "fehlt"
  sicher_allein: 0.80        # so ähnlich, dass es ohne gemeinsame Wörter reicht
  mindest_aehnlichkeit: 0.5  # darunter hilft auch kein gemeinsames Wort
  woerter_bonus: 0.3
  woerter_voll: 12
  max_haeufig: 0.02          # Wörter in höchstens 2 % der Meldungen gelten als selten
  schlagzeilen_bis: 10       # Plätze 1–10 der Schlagzeilen-Liste zählen voll, danach folgen dort Rubriken
  rubrik_anteil: 0.7         # so viel zählt jeder andere Eintrag (Rubrik-Listen, hintere Schlagzeilen)
  land: { DE: 1.5, US: 1.0, GB: 1.0 }
  maximum: 3.0               # höchstens so viel Aufmerksamkeit aus Google News, egal in wie vielen Listen
  eigene_geschichte: true    # passt keine eigene Geschichte, wird der Google-Eintrag selbst zur Geschichte (höchstens Kurz & knapp)
  gleich: 0.85               # Google-Einträge aus verschiedenen Listen ab dieser Ähnlichkeit = dieselbe Geschichte

# Google Trends: höchstens so viel Aufmerksamkeit insgesamt.
trends_maximum: 1.5

# Formate (PLAN.md 4.1). Keine feste Obergrenze an Karten.
top_anzahl: 7          # die besten (5–8) werden Top-Story, wenn sie über der Kartenschwelle liegen
# Kalibriert am 01.11.2026 an allen 3757 Geschichten eines Stands (metriken/verteilung/): ergibt im Bestand
# (48 Std) rund 60 Karten und 200 Kurzmeldungen, je Ausgabe neu etwa 15–25 Karten und 50 Zeilen.
schwelle_karte: 5.0    # Schwelle 1
schwelle_kurz: 3.0
# Feste Altersgrenze (Wunsch des Nutzers 04.11.2026): keine neue Meldung seit so vielen Stunden → weg.
# Neue Meldungen (neue Infos) machen die Geschichte wieder frisch.
max_alter_h: 48     # Schwelle 2, darunter fällt es weg, außer der Sicherheitsboden greift

# Sicherheitsboden: Ziel der App ist, über alles mitreden zu können, worüber geredet wird. Was in einer Google-Liste
# steht oder zu einem Suchtrend passt, ist immer mindestens Kurz & knapp; viele Redaktionen zählen nur, solange es frisch ist.
boden:
  frische_mindestens: 0.4  # nur für redaktionen_ab: Frische 0,4 ≈ 24 Std (Halbwertszeit 18 Std)
  schlagzeile_bis: 15      # Google-News-Schlagzeilen (Deutschland, USA, UK)
  rubrik_bis: 5            # Google-News-Rubriken (Deutschland, Welt, Wirtschaft, Technik, …)
  trends: true             # passt zu einem Google-Suchtrend
  redaktionen_ab: 5        # so viele unabhängige Redaktionen berichten

# Dubletten (Algorithmus A), siehe pipeline/cluster.py für die Bedeutung.
dubletten:
  zeitfenster_h: 36
  sicher: 0.88
  zusammen: 0.72
  sprachuebergreifend: 0.72
  grauzone: 0.55
  gruppe: 0.62
  selten: 0.05

# Dubletten mit KI (pipeline/dubletten.py), nur im Kartenbau, Gemini Flash Lite.
# Kosten: höchstens max_anfragen je Bau (8 von 500 am Tag ≈ 1,6 % je Bau, ≈ 5 % am Tag), meist weniger,
# weil frühere Urteile gemerkt werden.
dubletten_ki:
  an: true
  max_anfragen: 8
  speicher_tage: 2
  # Aufteilen: Karten-Geschichten mit mindestens 3 verschiedenen Schlagzeilen, Kurzmeldungen nur, wenn
  # eine Meldung im Mittel weniger als `einheitlich` ähnlich zum Rest ist
  aufteilen_max: 40
  aufteilen_pro_anfrage: 8
  aufteilen_titel: 20      # so viele verschiedene Schlagzeilen je Geschichte sieht die KI
  einheitlich: 0.5
  # Zusammenlegen: Paare gezeigter Geschichten, Wertung = Ähnlichkeit der Mittelpunkte + Bonus für seltene
  # gemeinsame Wörter (wie in cluster.py). Grauzonen-Paare aus cluster.py kommen immer dazu.
  vorauswahl: 0.4
  kandidat: 0.6
  woerter_bonus: 0.25
  woerter_voll: 12.0
  selten: 0.02
  max_paare: 120
  paare_pro_anfrage: 40

# Großthemen und Gesprächswert mit KI (pipeline/themen.py, Feedback des Nutzers 04.11.2026), nur im Kartenbau.
# Kosten: 1 Anfrage je Bau (Gemini Flash Lite, ≈ 0,2 % des Tageskontingents).
themen_ki:
  an: true
  max_geschichten: 400   # die wichtigsten so vielen Geschichten werden bewertet, der Rest bleibt unverändert
  min_teile: 3
  max_teile: 20
  # Wichtigkeit × Faktor je Gesprächswert (1 = kaum Gesprächsstoff, 3 = darüber reden alle)
  faktor: { 1: 0.4, 2: 1.0, 3: 1.35 }   # 4.11. abends: 0,6 senkte zu wenig (Feedback: überladen)
