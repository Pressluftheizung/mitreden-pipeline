# Gewichte für Algorithmus B (Wichtigkeit, PLAN.md 6B). Startwerte, werden in der Werkbank eingestellt.
#
# Wichtigkeit = (breite·Quellenbreite + lager·Lagerbreite + tempo·Tempo
#                + aufmerksamkeit·Aufmerksamkeit + platzierung·Platzierung)
#               × Mitreden-Faktor × Frische

gewichte:
  breite: 1.0
  lager: 0.6
  tempo: 0.5
  aufmerksamkeit: 1.2
  platzierung: 0.6

# Live-Aufmerksamkeit (PLAN.md 4.2): wird zum Mitreden-Faktor addiert (Aufmerksamkeit × live_faktor, höchstens live_maximum).
live_faktor: 0.4
live_maximum: 1.0

# Frische: Halbwertszeit in Stunden seit der neuesten Meldung der Geschichte.
frische_halbwertszeit_h: 18
frische_minimum: 0.2

# Tempo: Meldungen in den letzten Stunden.
tempo_fenster_h: 6

# Platzierung: Steht die Geschichte bei diesen Medien oben im Feed?
# (ap kommt über eine Google-News-Suche, deren Reihenfolge keine Startseite ist, deshalb nicht dabei.)
leitmedien: [tagesschau, spiegel, zeit, faz, sz, welt, bild, bbc_world, guardian_world, npr]
platzierung_bis: 10

# Google News Top (pipeline/abgleich.py): Wann gehört ein Google-Eintrag zu einer unserer Geschichten?
# Wert = Ähnlichkeit (bester Wert über alle Schlagzeilen des Eintrags) + Bonus für seltene gemeinsame Wörter.
# Je Google-Eintrag zählt die Hauptschlagzeile allein oder mindestens zwei verwandte Schlagzeilen (siehe abgleich.py).
# Geeicht am 28.10.2026 an 144 von Hand bewerteten Einträgen (zwei Stände): 96 von 99 echten Treffern gefunden,
# 2 falsch zugeordnet.
google_news:
  treffer: 0.85              # Ähnlichkeit + Wortbonus ab hier: gehört sicher zur Geschichte
  unsicher: 0.70             # nur für die Messung: darüber "unsicher" statt "fehlt"
  sicher_allein: 0.80        # so ähnlich, dass es ohne gemeinsame Wörter reicht
  mindest_aehnlichkeit: 0.5  # darunter hilft auch kein gemeinsames Wort
  woerter_bonus: 0.3
  woerter_voll: 12
  max_haeufig: 0.02          # Wörter in höchstens 2 % der Meldungen gelten als selten
  schlagzeilen_bis: 10       # Plätze 1–10 der Schlagzeilen-Liste zählen voll, danach folgen dort Rubriken
  rubrik_anteil: 0.7         # so viel zählt jeder andere Eintrag (Rubrik-Listen, hintere Schlagzeilen)
  land: { DE: 1.5, US: 1.0, GB: 1.0 }
  maximum: 3.0               # höchstens so viel Aufmerksamkeit aus Google News, egal in wie vielen Listen
  mindestens_kurz: true      # was Google in einer Liste zeigt, fällt nie weg (mindestens Kurz & knapp)
  eigene_geschichte: true    # passt keine eigene Geschichte, wird der Google-Eintrag selbst zur Geschichte (höchstens Kurz & knapp)
  gleich: 0.85               # Google-Einträge aus verschiedenen Listen ab dieser Ähnlichkeit = dieselbe Geschichte

# Google Trends: höchstens so viel Aufmerksamkeit insgesamt.
trends_maximum: 1.5

# Formate (PLAN.md 4.1). Keine feste Obergrenze an Karten.
top_anzahl: 7          # die besten (5–8) werden Top-Story, wenn sie über der Kartenschwelle liegen
schwelle_karte: 3.0    # Schwelle 1
schwelle_kurz: 1.5     # Schwelle 2, darunter fällt es weg

# Dubletten (Algorithmus A), siehe pipeline/cluster.py für die Bedeutung.
dubletten:
  zeitfenster_h: 36
  sicher: 0.88
  zusammen: 0.72
  sprachuebergreifend: 0.72
  grauzone: 0.55
  gruppe: 0.62
  selten: 0.05
