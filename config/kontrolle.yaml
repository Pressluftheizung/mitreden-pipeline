# Kontrolle (pipeline/kontrolle.py, PLAN.md 7 und 16): Nimmt unser Modell alles Relevante auf?

ziel_abdeckung: 0.95       # PLAN.md 7: Ziel über 95 %
warnung_abdeckung: 0.85    # darunter: rot
warnung_eigene_kern: 0.90  # Deutschland-Listen: so viel muss aus eigenen Quellen kommen, sonst fehlt eine Quelle
max_alter_sammeln_h: 3     # so alt darf der letzte Sammellauf höchstens sein
max_fehler_in_folge: 3     # ein Feed, der so oft hintereinander scheitert, gilt als ausgefallen
leer_seit_h: 72            # eine Quelle ohne neue Meldung so lange: auffällig (Rubrik-Feeds sind manchmal einen Tag still)
max_falsch_anteil: 0.03    # Prüfsets: so viele falsche Zuordnungen sind noch in Ordnung (Stand der Eichung: 2 %)
max_uebersehen_anteil: 0.05

# Gemessen wird an den Google-News-Listen aus config/sources.yaml (signale), je die ersten messen_bis Einträge.
# Ziel und Warnung gelten für jede Gruppe (kern = Deutschland, rubrik = deutsche Rubriken, global = USA und UK).
messen_bis: 10
