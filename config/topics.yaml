# Themen und Mitreden-Faktor (PLAN.md 4.2 und 4.3).
# Grundwerte: hoch = 1.0, mittel = 0.7, niedrig = 0.4 (Startwerte, werden in der Werkbank nachgestellt).
#
# Einordnung in Phase 1 ohne KI: Schlüsselwörter in Titel und Teaser plus die Quelle
# (ein kicker-Artikel ist fast immer Sport). Ab Phase 2 ordnet die KI ein, diese Liste bleibt als Rückfall.
# Schlüsselwörter: kleingeschrieben; ein Eintrag passt auf jedes Wort, das damit beginnt ("ice-" auf "ice-strecke").
# "=" vorne verlangt das ganze Wort ("=fed" passt nicht auf "federer"). Mehrere Wörter müssen aufeinander folgen.

themen:
  politik:
    name: Politik
    farbe: "#E5484D"
    unterthemen:
      bundespolitik:  { faktor: 1.0, woerter: [bundestag, bundesregierung, bundeskanzler, kanzler, merz, koalition, minister, cdu, csu, spd, grüne, afd, linke, bsw, fdp, bundesrat, gesetzentwurf, wehrdienst, wehrpflicht, haushalt] }
