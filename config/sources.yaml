# Quellen der Mitreden-Pipeline (PLAN.md 5.3, Format: docs/DATENFLUSS.md Abschnitt 7).
#
# ⚠ Die Spalte "lager" ist ein VORSCHLAG nach PLAN.md 8 (B2) und wird vom Nutzer reviewt.
#   Bis zur Freigabe wird sie nur gespeichert, aber nicht für Auswahl oder Gewichtung genutzt.
#
# lager:          links | mitte_links | mitte | mitte_rechts | rechts | international
#                 "international" = Auslandsmedien ohne Einordnung auf der deutschen/US-Skala.
# art:            agentur | oeffentlich_rechtlich | zeitung | magazin | fachmedium | aggregator
# bezahlschranke: nein | teilweise | ja
#   teilweise + Erkennungsregel (bezahl_muster / bezahl_stichwoerter / bezahl_feld):
#   Treffer = Bezahlartikel, sonst "unbekannt" (bei bezahl_markiert: true "frei").
# meinung_muster: zusätzlich zu den Standard-Mustern unten (B1, Teil des Bias-Reviews).

standard:
  meinung_muster: ["/meinung/", "/meinungen/", "/kommentar/", "/kommentare/", "/kolumne", "/debatte/",
                   "/debatten/", "/opinion/", "/opinions/", "/essay/", "/leitartikel/", "/gastbeitrag"]
  meinung_titel: ["Kommentar", "Meinung", "Kolumne", "Leitartikel", "Essay", "Gastbeitrag",
                  "Gastkommentar", "Opinion"]
  meinung_stichwoerter: ["Meinung", "Kommentar", "Kolumne", "Opinion", "Opinions"]
  # Bezahlte Werbetexte im Feed werden gar nicht gespeichert.
  werbung_titel: ["[Promoted Content]", "[Sponsored]", "Sponsored:", "Anzeige:", "[Anzeige]", "Advertorial"]

