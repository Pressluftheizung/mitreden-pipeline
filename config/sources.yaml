# Aufmerksamkeits-Signale (PLAN.md 5.2): nur Titel, Rang und bei Google News die verwandten Schlagzeilen, keine Texte.
# Google News: Schlagzeilen und Rubriken für Deutschland, USA und UK, je die ersten "anzahl" Einträge.
#   Sie geben Aufmerksamkeit, sind Maßstab der Kontrolle (gruppe: kern | rubrik | global) und sorgen dafür,
#   dass nichts fehlt: Findet sich keine eigene Geschichte, wird der Google-Eintrag selbst zur Geschichte.
# Wikipedia-Aufrufe kommen einmal täglich im Baulauf dazu.
signale:
  - { id: google_trends_de, url: "https://trends.google.com/trending/rss?geo=DE" }
